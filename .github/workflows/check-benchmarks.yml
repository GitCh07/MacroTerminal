# Temporary: live check of the Benchmarks (beta) stand-ins before merge. Removed before merging.
name: Check benchmarks (temporary)
on:
  push:
    branches: [benchmarks-beta]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet yfinance certifi
      - name: Tests
        working-directory: macro-terminal
        run: python test_macro_terminal.py && python test_benchmarks.py
      - name: Live snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro-terminal/macro_terminal.py --export /tmp/snap.json
      - name: Conventions
        working-directory: macro-terminal
        run: |
          python - <<'PY'
          import json, bisect
          from datetime import date, timedelta
          import benchmarks as bm, macro_terminal as mt
          D = date(2026, 11, 16)
          def me(d):  # last day of the month before d
              return date(d.year, d.month, 1) - timedelta(days=1)
          out = {}
          for t in ["^SP500TR", "EFA", "EMB", "EMLC", "AGG", "SHV", "TLT"]:
              rows = mt.yahoo_closes(t, adjusted=True, start="2015-06-01")
              ds = [date.fromisoformat(x) for x, _ in rows]; vs = [c for _, c in rows]
              def at(d, left=False):
                  i = (bisect.bisect_left(ds, d) if left else bisect.bisect_right(ds, d) - 1)
                  return vs[i]
              res = {}
              for n in (1, 3, 5, 10):
                  b = bm.years_back(D, n)
                  def ann(r): return round((r ** (1 / n) - 1) * 100, 2) if n > 1 else round((r - 1) * 100, 2)
                  res[n] = dict(
                      A_same_day=ann(at(D) / at(b)),
                      B_from_month_end=ann(at(D) / at(me(b))),
                      C_month_end_to_month_end=ann(at(me(D)) / at(me(bm.years_back(me(D) + timedelta(days=1), n)))),
                      D_quarter_end=ann(at(date(2026, 9, 30)) / at(date(2026 - n, 9, 30))),
                      E_next_day=ann(at(D) / at(b, left=True)),
                      F_month_end_after=ann(at(D) / at(date(b.year, b.month + 1, 1) - timedelta(days=1)) if b.month < 12 else 0),
                  )
              out[t] = res
          print("CONV", json.dumps(out))
          PY
      - name: Report
        working-directory: macro-terminal
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date, timedelta
          import benchmarks as bm, macro_terminal as mt
          s = json.load(open("/tmp/snap.json"))
          print("ERRORS", json.dumps(s["errors"]))
          print("MARKETS", json.dumps([[m["id"], m["score"], m["bias"]] for m in s["markets"]]))
          B = s["benchmarks"]
          print("BMDATES", json.dumps(B["dates"][-8:]))
          print("BMLINES", json.dumps({l["name"]: {d: l["returns"].get(d) for d in B["dates"][-8:]} for l in B["lines"]}))
          print("BMMISSING", json.dumps({l["name"]: l["missing"] for l in B["lines"] if l["missing"]}))
          # alternatives, to pick the closest stand-in for each line
          alt = {}
          start = (date.today() - timedelta(days=11 * 366)).isoformat()
          for t in ["SPY", "IVV", "VEA", "IEFA", "IEMG", "VWO", "BNDX", "IAGG", "IGOV", "BIL", "SGOV", "SCHO", "SPTL", "VGLT", "HYG", "USHY", "MUB", "VTEB", "SUB", "VTI", "IWM", "SCHH", "VNQ", "EWC", "^R25I", "^RUT"]:
              try:
                  rows = mt.yahoo_closes(t, adjusted=True, start=start)
                  d = [date.fromisoformat(x) for x, _ in rows]; v = [c for _, c in rows]
                  alt[t] = {d[i].isoformat(): bm.period_returns(d, v, i) for i in range(len(d) - 8, len(d))}
              except Exception as e:
                  alt[t] = str(e)
          series = {}
          for t in ["EFA", "EWC", "EEM", "IEMG"]:
              rows = mt.yahoo_closes(t, adjusted=True, start=start)
              series[t] = ([date.fromisoformat(x) for x, _ in rows], [c for _, c in rows])
          for w in (0.08, 0.10, 0.12, 0.14):
              for em in ("EEM", "IEMG"):
                  d, v = bm.blend(series, {"EFA": 0.8 * (1 - w), "EWC": 0.8 * w, em: 0.2})
                  alt["8020_can%g_%s" % (w, em)] = {d[i].isoformat(): bm.period_returns(d, v, i) for i in range(len(d) - 8, len(d))}
          print("ALT", json.dumps(alt))
          PY
