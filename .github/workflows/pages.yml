# Publishes Macro Terminal to GitHub Pages and refreshes the data on weekdays just after the main US releases.
# Needs: repo secret FRED_API_KEY, and Settings > Pages > Source set to "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # New York time: after the 8:30 releases (jobs, CPI, GDP, claims), the 10:00 releases (job openings, sentiment),
    # and once the day's rates and spreads have posted. Off the top of the hour, when GitHub's scheduler is busiest.
    # Keep in step with REFRESH_AT in macro_terminal.py (a test checks).
    - cron: "37 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 10 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 17 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional packages (sector and midterm panels)
        run: python -m pip install --quiet yfinance certifi
      - name: Build the snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro-terminal/macro_terminal.py --export macro-terminal/static/snapshot.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: macro-terminal/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
