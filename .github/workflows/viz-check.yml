name: Temporary check of the replay frames
on:
  push:
    branches: [replay-sections]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet yfinance certifi
      - name: Tests
        working-directory: macro-terminal
        run: python test_viz_frames.py && python test_macro_terminal.py && python test_benchmarks.py
      - name: Export with live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: time python macro-terminal/macro_terminal.py --export /tmp/snapshot.json && ls -la macro-terminal/static/viz/data
      - name: Summarise
        run: |
          python - <<'PY'
          import json
          D = "macro-terminal/static/viz/data/"
          s = json.load(open("/tmp/snapshot.json"))
          d = json.load(open(D + "yield_curve.json"))
          print("curve", d["months"][-3:], "partial", d["partial"], "built_for ok", d["built_for"] == s["fetched_at"])
          print("last frame", d["frames"][-1])
          b = json.load(open(D + "bias_history.json"))
          print("method", b["method"])
          print("note", b["note"])
          print("last == board", b["frames"][-1]["scores"] == {m["id"]: m["score"] for m in s["markets"]})
          for f in b["frames"][::12] + b["frames"][-2:]:
              print(f["date"], f["scores"])
          print("DUMP bias", json.dumps(b))
          print("DUMP curve", json.dumps(d))
          PY
      - name: Compare one vintage by hand
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          curl -s "https://api.stlouisfed.org/fred/series/observations?series_id=PAYEMS&api_key=$FRED_API_KEY&file_type=json&observation_start=2024-01-01&observation_end=2024-03-01&output_type=1&vintage_dates=2024-02-29,2024-03-31,2025-03-31" | python -c "import json,sys; print([(o['date'],o['value'],o['realtime_start'],o['realtime_end']) for o in json.load(sys.stdin)['observations']])"
