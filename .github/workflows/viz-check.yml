name: Temporary check of the animation frames
on:
  push:
    branches: [animations]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet yfinance certifi
      - name: Tests
        working-directory: macro-terminal
        run: python test_viz_frames.py && python test_macro_terminal.py && python test_benchmarks.py
      - name: Export with live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro-terminal/macro_terminal.py --export /tmp/snapshot.json && ls -la macro-terminal/static/viz/data
      - name: Summarise the frames
        run: |
          python - <<'PY'
          import json
          d = json.load(open("macro-terminal/static/viz/data/yield_curve.json"))
          print("months", d["months"][0], d["months"][-1], len(d["months"]), "partial", d["partial"])
          print("notes", d["notes"])
          print("last", dict(zip([m["label"] for m in d["maturities"]], d["frames"][-1])))
          print("inversions", d["inversions"])
          b = json.load(open("macro-terminal/static/viz/data/bias_history.json"))
          s = json.load(open("/tmp/snapshot.json"))
          print("last frame == board", b["frames"][-1]["scores"] == {m["id"]: m["score"] for m in s["markets"]})
          print("first", b["frames"][0]["date"], b["frames"][0]["scores"])
          l = json.load(open("macro-terminal/static/viz/data/benchmark_levels.json"))
          print("levels", l["months"][0], l["months"][-1], l["asof"], len(l["lines"]), [x["name"] for x in l["lines"]])
          L = [m["label"] for m in d["maturities"]]
          for m in ["2001-07", "2001-08", "2002-01", "2002-02", "2002-03", "2004-06", "2006-01", "2006-02", "2006-03", "1986-12", "1987-01", "1993-09", "1993-10"]:
              print(m, dict(zip(L, d["frames"][d["months"].index(m)])))
          for name in ["yield_curve.json", "bias_history.json", "benchmark_levels.json"]:
              print("DUMP", name, open("macro-terminal/static/viz/data/" + name).read())
          PY
      - name: Raw FRED monthly DGS30 around the gap
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          curl -s "https://api.stlouisfed.org/fred/series/observations?series_id=DGS30&api_key=$FRED_API_KEY&file_type=json&frequency=m&aggregation_method=avg&observation_start=2002-01-01&observation_end=2006-04-01" | python -c "import json,sys; print([(o['date'][:7], o['value']) for o in json.load(sys.stdin)['observations']])"
          curl -s "https://api.stlouisfed.org/fred/series/observations?series_id=DGS30&api_key=$FRED_API_KEY&file_type=json&observation_start=2002-02-12&observation_end=2002-02-25" | python -c "import json,sys; print([(o['date'], o['value']) for o in json.load(sys.stdin)['observations']])"
      - uses: actions/upload-artifact@v4
        with:
          name: viz-data
          path: macro-terminal/static/viz/data
          retention-days: 1
