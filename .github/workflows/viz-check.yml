name: Temporary check of the animation frames
on:
  push:
    branches: [animations]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet yfinance certifi
      - name: Tests
        working-directory: macro-terminal
        run: python test_viz_frames.py && python test_macro_terminal.py && python test_benchmarks.py
      - name: Export with live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro-terminal/macro_terminal.py --export /tmp/snapshot.json && ls -la macro-terminal/static/viz/data
      - name: Summarise the frames
        run: |
          python - <<'PY'
          import json
          d = json.load(open("macro-terminal/static/viz/data/yield_curve.json"))
          print("months", d["months"][0], d["months"][-1], len(d["months"]), "partial", d["partial"])
          print("notes", d["notes"])
          print("last", dict(zip([m["label"] for m in d["maturities"]], d["frames"][-1])))
          print("inversions", d["inversions"])
          b = json.load(open("macro-terminal/static/viz/data/bias_history.json"))
          s = json.load(open("/tmp/snapshot.json"))
          print("last frame == board", b["frames"][-1]["scores"] == {m["id"]: m["score"] for m in s["markets"]})
          print("first", b["frames"][0]["date"], b["frames"][0]["scores"])
          l = json.load(open("macro-terminal/static/viz/data/benchmark_levels.json"))
          print("levels", l["months"][0], l["months"][-1], l["asof"], len(l["lines"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: viz-data
          path: macro-terminal/static/viz/data
          retention-days: 1
